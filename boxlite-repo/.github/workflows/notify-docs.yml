# This workflow belongs in the boxlite-ai/boxlite repository.
# Copy this file to boxlite-ai/boxlite/.github/workflows/notify-docs.yml
#
# Required secret: DOCS_REPO_PAT — a GitHub PAT with `repo` scope
# that can trigger repository_dispatch on boxlite-ai/documentation.

name: Notify documentation repo

on:
  pull_request:
    types: [closed]

jobs:
  notify-docs:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Send repository_dispatch to documentation repo
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.DOCS_REPO_PAT }}
          repository: boxlite-ai/documentation
          event-type: boxlite-sdk-update
          client-payload: |
            {
              "pr_number": ${{ github.event.pull_request.number }},
              "pr_title": "${{ github.event.pull_request.title }}",
              "pr_url": "${{ github.event.pull_request.html_url }}",
              "pr_author": "${{ github.event.pull_request.user.login }}",
              "merge_sha": "${{ github.event.pull_request.merge_commit_sha }}",
              "diff_url": "${{ github.event.pull_request.diff_url }}",
              "changed_files": ${{ github.event.pull_request.changed_files }}
            }
