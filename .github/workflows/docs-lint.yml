name: Docs lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: No soft promises (AGENTS.md)
        run: python3 scripts/lint-docs.py .
      - name: llms.txt matches docs.json and page frontmatter
        run: python3 scripts/gen-llms-txt.py --check
